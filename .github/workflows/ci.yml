name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weft
          POSTGRES_PASSWORD: weft
          POSTGRES_DB: weft
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weft -d weft"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WEFT_TEST_DATABASE_URL: postgres://weft:weft@localhost:5432/weft
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo test -p weft-server --test postgres_smoke -- --ignored

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix flake check
      - run: nix build .#weft

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 tools/check_docs.py

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t weft:ci .

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/docker-compose.yml up -d --build
      - name: Wait for the node
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/docker-compose.yml logs
          exit 1
      - if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
