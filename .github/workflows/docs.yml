name: docs

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check documentation links
        run: python3 tools/check_docs.py
